<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KernelGreedyMIS Visualizer</title>
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    /* DARK THEME & RESPONSIVE CSS */
    :root {
      --bg-color: #121212;
      --surface-color: #1e1e1e;
      --text-color: #e0e0e0;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --border-color: #333;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 10px;
      min-height: 100vh;
    }

    h2 {
      margin: 10px 0;
      font-size: 1.5rem;
      text-align: center;
    }

    /* Responsive Stats Panel */
    .stats-panel {
      display: flex;
      flex-wrap: wrap; /* Wraps on mobile */
      justify-content: center;
      gap: 15px;
      margin-bottom: 15px;
      background: var(--surface-color);
      padding: 10px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      border: 1px solid var(--border-color);
      width: 90%;
      max-width: 600px;
    }

    .stat-val {
      color: var(--accent-color);
      font-weight: bold;
      font-size: 1.1em;
      margin-left: 5px;
    }

    /* Responsive Graph Container */
    #container {
      width: 100%;
      max-width: 1000px;
      height: 60vh; /* Takes 60% of screen height */
      border: 1px solid var(--border-color);
      border-radius: 12px;
      background-color: var(--surface-color);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
      font-size: 1rem;
      color: #bbb;
      height: 40px; /* Fixed height prevents jumping */
      text-align: center;
      padding: 0 10px;
    }

    /* Controls & Legend */
    .controls {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      width: 100%;
      justify-content: center;
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 8px;
      transition: background 0.2s, transform 0.1s;
      width: auto;
    }

    button:hover { background-color: var(--accent-hover); }
    button:active { transform: scale(0.98); }
    button:disabled { background-color: #444; color: #888; cursor: not-allowed; }

    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-top: 15px;
      font-size: 0.9rem;
      color: #bbb;
    }

    .dot { width: 10px; height: 10px; display: inline-block; border-radius: 50%; margin-right: 6px; }
  </style>
</head>
<body>

  <h2>KernelGreedyMIS</h2>
  
  <div class="stats-panel">
    <span>Nodes (|V|): <span id="val-size" class="stat-val">0</span></span>
    <span>MIS Size: <span id="val-mis" class="stat-val">0</span></span>
  </div>

  <div id="container"></div>

  <div id="status">Ready to start...</div>

  <div class="controls">
    <button id="btnStart" onclick="startAnimation()">Start</button>
    <button id="btnReset" onclick="resetGraph()" style="background-color: #555;">Reset</button>
  </div>

  <div class="legend">
    <span><span class="dot" style="background:#444;"></span>Unprocessed</span>
    <span><span class="dot" style="background:#FFD700;"></span>Scanning</span>
    <span><span class="dot" style="background:#32CD32;"></span>Selected</span>
    <span><span class="dot" style="background:#FF6347;"></span>Removed</span>
  </div>

<script>
  // --- DARK MODE COLORS ---
  const COLORS = {
    unprocessed: '#444444', // Dark Gray
    active: '#FFD700',      // Gold
    selected: '#32CD32',    // Lime Green
    removed: '#FF6347',     // Tomato Red
    border: '#000000',      // Black borders for contrast
    text: '#ffffff'         // White Text
  };

  const NODES = [
    { id: 'A', label: 'A' }, 
    { id: 'B', label: 'B' }, { id: 'C', label: 'C' }, { id: 'D', label: 'D' }, { id: 'E', label: 'E' },
    { id: 'F', label: 'F' }, { id: 'G', label: 'G' }, { id: 'H', label: 'H' }, { id: 'I', label: 'I' },
    { id: 'J', label: 'J' }, { id: 'K', label: 'K' }, { id: 'L', label: 'L' }
  ];

  const EDGES = [
    { from: 'B', to: 'C' }, { from: 'C', to: 'D' }, { from: 'C', to: 'E' },
    { from: 'F', to: 'G' }, { from: 'F', to: 'H' }, { from: 'G', to: 'H' }, { from: 'H', to: 'I' },
    { from: 'I', to: 'J' }, { from: 'J', to: 'K' }, { from: 'K', to: 'L' }, { from: 'L', to: 'I' }
  ];

  let network = null;
  let nodesDataSet = new vis.DataSet(NODES);
  let edgesDataSet = new vis.DataSet(EDGES);
  let misCounter = 0;

  function init() {
    const container = document.getElementById('container');
    const data = { nodes: nodesDataSet, edges: edgesDataSet };
    
    // VIS.JS DARK THEME OPTIONS
    const options = {
      nodes: { 
        shape: 'dot', 
        size: 25, 
        font: { size: 16, color: COLORS.text, strokeWidth: 0 }, 
        color: { background: COLORS.unprocessed, border: COLORS.border, highlight: { border: '#fff' } },
        borderWidth: 2
      },
      edges: { 
        width: 2, 
        color: '#666666' // Lighter gray edges for visibility on dark bg
      },
      physics: { enabled: true, stabilization: { iterations: 200 } },
      interaction: { hover: true, zoomView: false } // Disable zoom on mobile to prevent accidents
    };
    
    network = new vis.Network(container, data, options);
    
    // Initial Stats
    document.getElementById('val-size').innerText = NODES.length;
    document.getElementById('val-mis').innerText = "0";
  }

  // --- ANIMATION LOGIC ---
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  
  async function updateNode(id, colorType, message) {
    nodesDataSet.update({ id: id, color: { background: COLORS[colorType] } });
    
    if(colorType === 'selected') {
      misCounter++;
      document.getElementById('val-mis').innerText = misCounter;
    }

    if(message) document.getElementById('status').innerText = message;
    await sleep(1200); // Slightly faster for mobile attention spans
  }

  async function startAnimation() {
    document.getElementById('btnStart').disabled = true;
    
    // STAGE 1
    await updateNode('A', 'active', "Stage 1: Scanning isolated node 'A'");
    await updateNode('A', 'selected', "Node 'A' selected (Rule 1).");

    await updateNode('B', 'active', "Stage 1: Scanning pendant node 'B'");
    nodesDataSet.update({ id: 'C', color: { background: COLORS.removed } });
    await updateNode('B', 'selected', "Selected 'B', removed 'C' (Rule 2).");

    await updateNode('F', 'active', "Stage 1: Scanning triangle node 'F'");
    nodesDataSet.update([{ id: 'G', color: { background: COLORS.removed } }, { id: 'H', color: { background: COLORS.removed } }]);
    await updateNode('F', 'selected', "Selected 'F', removed neighbors (Rule 3).");

    // STAGE 2
    document.getElementById('status').innerText = "Stage 2: Switching to Greedy...";
    await sleep(1500);

    await updateNode('D', 'selected', "Greedy: 'D' is isolated. Selected.");
    await updateNode('E', 'selected', "Greedy: 'E' is isolated. Selected.");

    await updateNode('I', 'active', "Greedy: 'I' has min degree.");
    nodesDataSet.update([{ id: 'J', color: { background: COLORS.removed } }, { id: 'L', color: { background: COLORS.removed } }]);
    await updateNode('I', 'selected', "Selected 'I'. Removed neighbors.");

    await updateNode('K', 'active', "Greedy: Only 'K' remains.");
    await updateNode('K', 'selected', "Done! Max Independent Set Found.");
    
    document.getElementById('btnStart').disabled = false;
  }

  function resetGraph() {
    nodesDataSet.clear();
    edgesDataSet.clear();
    nodesDataSet.add(NODES.map(n => ({...n, color: { background: COLORS.unprocessed }})));
    edgesDataSet.add(EDGES);
    misCounter = 0;
    document.getElementById('val-mis').innerText = "0";
    document.getElementById('status').innerText = "Ready to start...";
    network.fit();
  }

  window.onload = init;
</script>

</body>
</html>
